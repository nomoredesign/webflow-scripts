<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Segment Clock</title>
<style>
  :root {
    --digit-size: 200px;        /* height of one digit */
    --seg-color: #ff3b30;       /* lit segment colour */
    --bg: #0a0a0a;              /* page / panel background */
    --off-opacity: 0.10;        /* visibility of unlit "ghost" segments */
    --glow: 0px;                /* glow radius (0 = off) */
    --slant: 0deg;              /* digit slant */
    --line-color: #ff3b30;      /* orbital ring lines */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 48px;
    background: var(--bg);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    color: #e0e0e0;
    padding: 32px;
    transition: background 0.2s;
    overflow-x: hidden;
  }

  /* ---------- Clock ---------- */
  .clock {
    display: flex;
    align-items: center;
    gap: calc(var(--digit-size) * 0.10);
    transform: skewX(calc(var(--slant) * -1));
  }
  .group { display: flex; gap: calc(var(--digit-size) * 0.06); }

  .digit {
    width: calc(var(--digit-size) * 0.6);
    height: var(--digit-size);
    display: block;
  }

  .seg {
    fill: var(--seg-color);
    opacity: var(--off-opacity);
    transition: opacity 0.12s ease;
  }
  .seg.on { opacity: 1; }

  /* glow only on lit segments */
  .clock.glow .seg.on {
    filter: drop-shadow(0 0 var(--glow) var(--seg-color));
  }

  /* colon */
  .colon {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: calc(var(--digit-size) * 0.18);
    height: var(--digit-size);
  }
  .colon .dot {
    width: calc(var(--digit-size) * 0.1);
    height: calc(var(--digit-size) * 0.1);
    border-radius: 50%;
    background: var(--seg-color);
    animation: blink 2s steps(1) infinite;
  }
  .clock.glow .colon .dot {
    filter: drop-shadow(0 0 var(--glow) var(--seg-color));
  }
  @keyframes blink { 50% { opacity: 0.25; } }

  /* ---------- Orbital face ---------- */
  .orbital {
    width: calc(var(--digit-size) * 2.2);
    height: calc(var(--digit-size) * 2.2);
    display: none;                 /* shown when its face is selected */
    transform: skewX(calc(var(--slant) * -1));
  }
  body.face-orbital .clock { display: none; }
  body.face-orbital .orbital { display: block; }

  .orbital .disc { fill: var(--seg-color); }
  .orbital .ring {
    fill: none;
    stroke: var(--line-color);
    stroke-width: 3;
  }
  .orbital .marker { fill: var(--seg-color); }
  .orbital .marker.hollow {
    fill: var(--bg);
    stroke: var(--line-color);
    stroke-width: 3;
  }
  .orbital.glow .disc,
  .orbital.glow .marker {
    filter: drop-shadow(0 0 var(--glow) var(--seg-color));
  }
  .orbital.glow .ring {
    filter: drop-shadow(0 0 var(--glow) var(--line-color));
  }

  /* optional pieces of the orbital face */
  .orbital.no-disc .disc { display: none; }
  .orbital.no-seconds .ring-seconds,
  .orbital.no-seconds #secondMarker { display: none; }

  /* show controls relevant to the active face only */
  body.face-orbital [data-only="segments"] { display: none; }
  body:not(.face-orbital) [data-only="orbital"] { display: none; }

  /* ---------- Controls ---------- */
  .controls {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 20px 28px;
    width: 100%;
    max-width: 820px;
    background: #151515;
    border: 1px solid #262626;
    border-radius: 16px;
    padding: 24px 28px;
  }
  .control { display: flex; flex-direction: column; gap: 8px; }
  .control label {
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #888;
  }
  .control .value { color: #ccc; font-variant-numeric: tabular-nums; }
  .control input[type="range"] { width: 100%; accent-color: #7c5cff; }
  .control input[type="color"] {
    width: 100%;
    height: 40px;
    border: 1px solid #333;
    border-radius: 8px;
    background: #0d0d0d;
    cursor: pointer;
  }
  .control-wide { grid-column: 1 / -1; display: flex; gap: 12px; flex-wrap: wrap; }
  .toggle {
    flex: 1;
    min-width: 130px;
    padding: 10px 12px;
    background: #0d0d0d;
    color: #e0e0e0;
    border: 1px solid #333;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .toggle.active { background: #7c5cff; border-color: #7c5cff; color: #fff; }
  .toggle:hover { border-color: #7c5cff; }

  /* ---------- Floating toolbar ---------- */
  .toolbar {
    position: fixed;
    top: 16px;
    right: 16px;
    display: flex;
    gap: 8px;
    z-index: 10;
  }
  .toolbar button {
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(20, 20, 20, 0.7);
    color: #ddd;
    border: 1px solid #333;
    border-radius: 10px;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: background 0.15s, border-color 0.15s, opacity 0.3s;
  }
  .toolbar button:hover { border-color: #7c5cff; color: #fff; }
  .toolbar button svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .toolbar button .icon-exit { display: none; }
  .toolbar button.is-active .icon-enter { display: none; }
  .toolbar button.is-active .icon-exit { display: block; }

  /* hidden-menu state */
  body.menu-hidden .controls { display: none; }

  /* let the toolbar fade out when idle in fullscreen for a clean look */
  body.immersive .toolbar { opacity: 0; }
  body.immersive .toolbar:hover,
  body.immersive.toolbar-awake .toolbar { opacity: 1; }
</style>
</head>
<body>

  <div class="clock" id="clock">
    <div class="group" data-unit="hours"></div>
    <div class="colon"><span class="dot"></span><span class="dot"></span></div>
    <div class="group" data-unit="minutes"></div>
    <div class="colon" data-seconds-sep><span class="dot"></span><span class="dot"></span></div>
    <div class="group" data-unit="seconds" data-seconds-group></div>
  </div>

  <svg class="orbital" id="orbital" viewBox="0 0 400 400" aria-label="Orbital watch face">
    <circle class="disc" cx="200" cy="200" r="95"></circle>
    <circle class="ring" cx="200" cy="200" r="120"></circle>
    <circle class="ring" cx="200" cy="200" r="150"></circle>
    <circle class="ring ring-seconds" cx="200" cy="200" r="180"></circle>
    <circle class="marker hollow" id="hourMarker" r="16"></circle>
    <circle class="marker" id="minuteMarker" r="12"></circle>
    <circle class="marker" id="secondMarker" r="11"></circle>
  </svg>

  <div class="toolbar">
    <button id="menuToggle" title="Hide / show menu" aria-label="Hide or show menu">
      <svg viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    </button>
    <button id="fsToggle" class="" title="Toggle full screen" aria-label="Toggle full screen">
      <svg class="icon-enter" viewBox="0 0 24 24"><path d="M4 9V5a1 1 0 0 1 1-1h4M20 9V5a1 1 0 0 0-1-1h-4M4 15v4a1 1 0 0 0 1 1h4M20 15v4a1 1 0 0 1-1 1h-4"/></svg>
      <svg class="icon-exit" viewBox="0 0 24 24"><path d="M9 4v3a2 2 0 0 1-2 2H4M15 4v3a2 2 0 0 0 2 2h3M9 20v-3a2 2 0 0 0-2-2H4M15 20v-3a2 2 0 0 1 2-2h3"/></svg>
    </button>
  </div>

  <div class="controls">
    <div class="control-wide">
      <button class="toggle active" id="faceSegments" data-face="segments">Segment display</button>
      <button class="toggle" id="faceOrbital" data-face="orbital">Orbital</button>
    </div>

    <div class="control">
      <label>Size <span class="value" id="sizeVal"></span></label>
      <input type="range" id="size" min="80" max="360" step="10">
    </div>
    <div class="control">
      <label>Colour</label>
      <input type="color" id="segColor">
    </div>
    <div class="control">
      <label>Background</label>
      <input type="color" id="bgColor">
    </div>
    <div class="control" data-only="segments">
      <label>Off-segment dimness <span class="value" id="offVal"></span></label>
      <input type="range" id="off" min="0" max="30" step="1">
    </div>
    <div class="control">
      <label>Glow <span class="value" id="glowVal"></span></label>
      <input type="range" id="glow" min="0" max="40" step="1">
    </div>
    <div class="control" data-only="segments">
      <label>Slant <span class="value" id="slantVal"></span></label>
      <input type="range" id="slant" min="0" max="20" step="1">
    </div>
    <div class="control" data-only="orbital">
      <label>Line colour</label>
      <input type="color" id="lineColor">
    </div>

    <div class="control-wide" data-only="segments">
      <button class="toggle" id="formatToggle">24-hour</button>
      <button class="toggle" id="secondsToggle">Show seconds</button>
    </div>

    <div class="control-wide" data-only="orbital">
      <button class="toggle active" id="orbSeconds">Show seconds</button>
      <button class="toggle active" id="orbCentre">Show centre</button>
    </div>
  </div>

<script>
(function () {
  var root = document.documentElement;
  var clock = document.getElementById('clock');

  // SVG geometry for one 16-segment ("starburst") digit (viewBox 0 0 120 200)
  //   A1 A2 = split top      G1 G2 = split middle      D1 D2 = split bottom
  //   F E   = left verticals B C   = right verticals    I L  = centre verticals
  //   H J K M = the four diagonals
  var SEG_POINTS = {
    A1: '28,18 34,12 52,12 58,18 52,24 34,24',
    A2: '62,18 68,12 86,12 92,18 86,24 68,24',
    F:  '18,28 26,36 26,82 18,90 10,82 10,36',
    I:  '60,28 66,36 66,82 60,90 54,82 54,36',
    B:  '102,28 110,36 110,82 102,90 94,82 94,36',
    G1: '28,100 34,94 52,94 58,100 52,106 34,106',
    G2: '62,100 68,94 86,94 92,100 86,106 68,106',
    E:  '18,110 26,118 26,164 18,172 10,164 10,118',
    L:  '60,110 66,118 66,164 60,172 54,164 54,118',
    C:  '102,110 110,118 110,164 102,172 94,164 94,118',
    D1: '28,182 34,176 52,176 58,182 52,188 34,188',
    D2: '62,182 68,176 86,176 92,182 86,188 68,188',
    H:  '28.2,34.4 37.8,31.6 54.8,88.6 45.2,91.4',
    J:  '82.2,31.6 91.8,34.4 74.8,91.4 65.2,88.6',
    K:  '37.8,168.4 28.2,165.6 45.2,111.4 54.8,108.6',
    M:  '91.8,165.6 82.2,168.4 65.2,111.4 74.8,108.6'
  };

  // which segments are lit for each character
  var SEG_MAP = {
    '0': ['A1', 'A2', 'B', 'C', 'D1', 'D2', 'E', 'F'],
    '1': ['B', 'C'],
    '2': ['A1', 'A2', 'B', 'G1', 'G2', 'E', 'D1', 'D2'],
    '3': ['A1', 'A2', 'B', 'C', 'G1', 'G2', 'D1', 'D2'],
    '4': ['F', 'B', 'G1', 'G2', 'C'],
    '5': ['A1', 'A2', 'F', 'G1', 'G2', 'C', 'D1', 'D2'],
    '6': ['A1', 'A2', 'F', 'E', 'G1', 'G2', 'C', 'D1', 'D2'],
    '7': ['A1', 'A2', 'B', 'C'],
    '8': ['A1', 'A2', 'B', 'C', 'D1', 'D2', 'E', 'F', 'G1', 'G2'],
    '9': ['A1', 'A2', 'B', 'C', 'F', 'G1', 'G2', 'D1', 'D2'],
    ' ': []
  };

  var SVGNS = 'http://www.w3.org/2000/svg';

  function makeDigit() {
    var svg = document.createElementNS(SVGNS, 'svg');
    svg.setAttribute('class', 'digit');
    svg.setAttribute('viewBox', '0 0 120 200');
    var segs = {};
    Object.keys(SEG_POINTS).forEach(function (key) {
      var poly = document.createElementNS(SVGNS, 'polygon');
      poly.setAttribute('class', 'seg');
      poly.setAttribute('points', SEG_POINTS[key]);
      svg.appendChild(poly);
      segs[key] = poly;
    });
    svg._segs = segs;
    return svg;
  }

  function setDigit(svg, char) {
    if (svg._current === char) return;
    var lit = SEG_MAP[char] || [];
    Object.keys(svg._segs).forEach(function (key) {
      svg._segs[key].classList.toggle('on', lit.indexOf(key) !== -1);
    });
    svg._current = char;
  }

  // create two digits in each group
  var groups = {};
  Array.prototype.forEach.call(document.querySelectorAll('.group'), function (g) {
    var d1 = makeDigit(), d2 = makeDigit();
    g.appendChild(d1);
    g.appendChild(d2);
    groups[g.getAttribute('data-unit')] = [d1, d2];
  });

  // ----- Clock tick -----
  var use24 = true;
  var showSeconds = false;

  function render() {
    var now = new Date();
    var h = now.getHours();
    if (!use24) { h = h % 12; if (h === 0) h = 12; }
    var hh = String(h).padStart(2, '0');
    var mm = String(now.getMinutes()).padStart(2, '0');
    var ss = String(now.getSeconds()).padStart(2, '0');

    setDigit(groups.hours[0], hh[0]);
    setDigit(groups.hours[1], hh[1]);
    setDigit(groups.minutes[0], mm[0]);
    setDigit(groups.minutes[1], mm[1]);
    if (showSeconds) {
      setDigit(groups.seconds[0], ss[0]);
      setDigit(groups.seconds[1], ss[1]);
    }
  }

  render();
  setInterval(render, 1000);

  // ----- Orbital face -----
  var orbital = document.getElementById('orbital');
  var hourMarker = document.getElementById('hourMarker');
  var minuteMarker = document.getElementById('minuteMarker');
  var secondMarker = document.getElementById('secondMarker');
  var ORBIT = { cx: 200, cy: 200, hour: 120, minute: 150, second: 180 };
  var orbitalActive = false;
  var orbitalRAF = null;

  function placeMarker(marker, radius, frac) {
    var theta = frac * Math.PI * 2 - Math.PI / 2;   // 0 = top, clockwise
    marker.setAttribute('cx', ORBIT.cx + radius * Math.cos(theta));
    marker.setAttribute('cy', ORBIT.cy + radius * Math.sin(theta));
  }

  function renderOrbital() {
    var now = new Date();
    var s = now.getSeconds() + now.getMilliseconds() / 1000;
    var m = now.getMinutes() + s / 60;
    var h = (now.getHours() % 12) + m / 60;
    placeMarker(hourMarker, ORBIT.hour, h / 12);
    placeMarker(minuteMarker, ORBIT.minute, m / 60);
    placeMarker(secondMarker, ORBIT.second, s / 60);
  }

  function orbitalLoop() {
    if (!orbitalActive) return;
    renderOrbital();
    orbitalRAF = requestAnimationFrame(orbitalLoop);
  }

  renderOrbital();   // position markers correctly even before first show

  // ----- Controls -----
  function $(id) { return document.getElementById(id); }

  var size = $('size'), sizeVal = $('sizeVal');
  var segColor = $('segColor');
  var bgColor = $('bgColor');
  var lineColor = $('lineColor');
  var off = $('off'), offVal = $('offVal');
  var glow = $('glow'), glowVal = $('glowVal');
  var slant = $('slant'), slantVal = $('slantVal');
  var formatToggle = $('formatToggle');
  var secondsToggle = $('secondsToggle');
  var secondsGroup = document.querySelector('[data-seconds-group]');
  var secondsSep = document.querySelector('[data-seconds-sep]');

  // apply the initial seconds visibility (default: hidden)
  secondsToggle.classList.toggle('active', showSeconds);
  secondsGroup.style.display = showSeconds ? '' : 'none';
  secondsSep.style.display = showSeconds ? '' : 'none';

  function readVar(name) {
    return getComputedStyle(root).getPropertyValue(name).trim();
  }

  // init control values from CSS defaults
  var initialSize = parseInt(readVar('--digit-size'), 10) || 200;
  size.value = initialSize;
  sizeVal.textContent = initialSize + 'px';

  segColor.value = '#ff3b30';
  bgColor.value = '#0a0a0a';
  lineColor.value = '#ff3b30';

  var initialOff = Math.round(parseFloat(readVar('--off-opacity')) * 100) || 10;
  off.value = initialOff;
  offVal.textContent = initialOff + '%';

  glow.value = 0;
  glowVal.textContent = 'off';

  slant.value = 0;
  slantVal.textContent = '0°';

  size.addEventListener('input', function () {
    root.style.setProperty('--digit-size', this.value + 'px');
    sizeVal.textContent = this.value + 'px';
  });

  segColor.addEventListener('input', function () {
    root.style.setProperty('--seg-color', this.value);
  });

  bgColor.addEventListener('input', function () {
    root.style.setProperty('--bg', this.value);
  });

  lineColor.addEventListener('input', function () {
    root.style.setProperty('--line-color', this.value);
  });

  off.addEventListener('input', function () {
    root.style.setProperty('--off-opacity', (this.value / 100).toString());
    offVal.textContent = this.value + '%';
  });

  glow.addEventListener('input', function () {
    var v = parseInt(this.value, 10);
    root.style.setProperty('--glow', v + 'px');
    glowVal.textContent = v === 0 ? 'off' : v + 'px';
    clock.classList.toggle('glow', v > 0);
    orbital.classList.toggle('glow', v > 0);
  });

  slant.addEventListener('input', function () {
    root.style.setProperty('--slant', this.value + 'deg');
    slantVal.textContent = this.value + '°';
  });

  formatToggle.addEventListener('click', function () {
    use24 = !use24;
    this.textContent = use24 ? '24-hour' : '12-hour';
    this.classList.toggle('active', !use24);
    render();
  });

  secondsToggle.addEventListener('click', function () {
    showSeconds = !showSeconds;
    this.classList.toggle('active', showSeconds);
    secondsGroup.style.display = showSeconds ? '' : 'none';
    secondsSep.style.display = showSeconds ? '' : 'none';
    if (showSeconds) render();
  });

  // ----- Watch-face switch -----
  var faceSegments = $('faceSegments');
  var faceOrbital = $('faceOrbital');

  function setFace(face) {
    orbitalActive = (face === 'orbital');
    document.body.classList.toggle('face-orbital', orbitalActive);
    faceSegments.classList.toggle('active', !orbitalActive);
    faceOrbital.classList.toggle('active', orbitalActive);
    if (orbitalActive) {
      renderOrbital();
      orbitalLoop();
    } else if (orbitalRAF) {
      cancelAnimationFrame(orbitalRAF);
      orbitalRAF = null;
    }
  }

  faceSegments.addEventListener('click', function () { setFace('segments'); });
  faceOrbital.addEventListener('click', function () { setFace('orbital'); });

  // orbital: show/hide the seconds ring + marker
  $('orbSeconds').addEventListener('click', function () {
    this.classList.toggle('active');
    orbital.classList.toggle('no-seconds', !this.classList.contains('active'));
  });

  // orbital: show/hide the centre disc
  $('orbCentre').addEventListener('click', function () {
    this.classList.toggle('active');
    orbital.classList.toggle('no-disc', !this.classList.contains('active'));
  });

  // ----- Hide / show menu -----
  var menuToggle = $('menuToggle');
  menuToggle.addEventListener('click', function () {
    document.body.classList.toggle('menu-hidden');
  });
  // press "h" to toggle the menu too
  document.addEventListener('keydown', function (e) {
    if (e.key === 'h' || e.key === 'H') {
      document.body.classList.toggle('menu-hidden');
    }
  });

  // ----- Full screen -----
  var fsToggle = $('fsToggle');

  function isFullscreen() {
    return document.fullscreenElement || document.webkitFullscreenElement;
  }
  function enterFullscreen() {
    var el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }
  function exitFullscreen() {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  }
  fsToggle.addEventListener('click', function () {
    if (isFullscreen()) exitFullscreen();
    else enterFullscreen();
  });

  function syncFullscreen() {
    var on = !!isFullscreen();
    fsToggle.classList.toggle('is-active', on);
    document.body.classList.toggle('immersive', on);
  }
  document.addEventListener('fullscreenchange', syncFullscreen);
  document.addEventListener('webkitfullscreenchange', syncFullscreen);

  // briefly reveal the toolbar on mouse move while immersive, then let it fade
  var awakeTimer;
  document.addEventListener('mousemove', function () {
    if (!document.body.classList.contains('immersive')) return;
    document.body.classList.add('toolbar-awake');
    clearTimeout(awakeTimer);
    awakeTimer = setTimeout(function () {
      document.body.classList.remove('toolbar-awake');
    }, 2000);
  });
})();
</script>
</body>
</html>
